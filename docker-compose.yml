services:
  db:
    image: mysql:8.0
    container_name: shopwise-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: shopwise360
    volumes:
      - db_data:/var/lib/mysql
      # schema is applied automatically on first boot
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: shopwise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # one-shot seeder — creates demo users/catalog/orders on an empty database
  seed:
    build:
      context: ./server
    command: npm run seed
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: shopwise360
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ./server
    container_name: shopwise-server
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: shopwise360
      JWT_SECRET: change_this_to_a_long_random_string
      ML_SERVICE_URL: http://ml-service:6000
      REDIS_URL: redis://redis:6379
      DASH_CACHE_TTL: 60
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  ml-service:
    build:
      context: ./ml-service
    container_name: shopwise-ml
    restart: unless-stopped
    environment:
      ML_PORT: 6000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: shopwise360
    ports:
      - "6000:6000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: shopwise-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "3001:3001"
    depends_on:
      - server

volumes:
  db_data: